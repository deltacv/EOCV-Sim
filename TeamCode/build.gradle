plugins {
    id 'org.jetbrains.kotlin.jvm'
}

apply from: '../build.common.gradle'

dependencies {
    api project(':VisionBench')
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

tasks.register('runSim', JavaExec) {
    dependsOn 'classes'
    dependsOn ':EOCV-Sim:processNativesResources'
    dependsOn ':EOCV-Sim:processEmbeddedPluginsResources'

    mainClass = 'com.github.serivesmejia.eocvsim.Main'

    classpath = sourceSets.main.runtimeClasspath +
            project(':EOCV-Sim').sourceSets.natives.output +
            project(':EOCV-Sim').sourceSets.embeddedPlugins.output
}